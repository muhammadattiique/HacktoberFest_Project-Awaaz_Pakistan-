services:
  ollama:
    image: ollama/ollama:latest
    container_name: awaaz_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awaaz_backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b-instruct
      - WHISPER_MODEL=base
      - DATABASE_URL=sqlite+aiosqlite:///./awaaz.db
      - RATE_LIST_PATH=./rate-list.json
      - CORS_ORIGINS=*
      # Shared secret for the Price Magistrate portal. Override in production
      # with a long random value (e.g. via a .env file next to this compose file).
      - AWAAZ_ADMIN_API_KEY=${AWAAZ_ADMIN_API_KEY:-awaaz-admin-2024}
    depends_on:
      - ollama
    restart: unless-stopped
    volumes:
      - ./awaaz.db:/app/awaaz.db

volumes:
  ollama_data:

